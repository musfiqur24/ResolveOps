name: resolveops

services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: reliability_command_center
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok || quit(1)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: development
      PORT: "5001"
      MONGODB_URI: mongodb://mongo:27017/reliability_command_center
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_for_development_only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: http://localhost:5173
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-15}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      # This URL is used by code running in the browser, not by the container.
      VITE_API_URL: http://localhost:5001/api
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
